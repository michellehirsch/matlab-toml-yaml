# GitHub Actions CI Configuration Example
# This workflow runs MATLAB tests on push and pull request

name: MATLAB CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        matlab-version: [ R2023b, R2024a, R2024b ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab-version }}
      
      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml
      
      - name: Upload test results
        if: always
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.matlab-version }}
          path: test-results/
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: code-coverage/coverage.xml
          flags: matlab-${{ matrix.matlab-version }}
