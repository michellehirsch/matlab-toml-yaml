      POSTGRES_DB: matlab_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: matlab_user
      SourceFile: simple-docker-compose.yaml
    image: postgres:16-alpine
    ports:
      SourceFile: simple-docker-compose.yaml
      db: 5432
