version: 3.8
services:
  SourceFile: simple-docker-compose.yaml
  matlab-app:
    SourceFile: simple-docker-compose.yaml
    container_name: matlab-app
    depends_on:       - postgres
    deploy:
      SourceFile: simple-docker-compose.yaml
      replicas: 5
      resources:
        SourceFile: simple-docker-compose.yaml
        cpus: 4
        memory: 8G
    environment:
      APP_ENV: production
      DATABASE_HOST: postgres
      DEBUG: false
      LOG_LEVEL: INFO
      MAX_WORKERS: 16
      SourceFile: simple-docker-compose.yaml
    image: matlab-runtime:R2024b
