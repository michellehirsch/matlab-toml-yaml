# Simple GitHub Actions Configuration
# Runs MATLAB tests on push

name: MATLAB Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      
      - name: Run Tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src
